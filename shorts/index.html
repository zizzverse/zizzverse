<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="description"
        content="ZIZZVERSE — Anime Shorts"
    >

    <title>ZIZZVERSE — Shorts</title>

    <link
        rel="stylesheet"
        href="shorts.css"
    >

</head>


<body>


    <!-- =================================================
         TOP NAVIGATION
    ================================================= -->

    <header class="top-nav">

        <a href="../" class="logo">
            ZIZZ<span>VERSE</span>
        </a>

        <div class="nav-actions">

            <button
                class="nav-btn"
                id="searchBtn"
                type="button"
                aria-label="Search"
            >
                🔍
            </button>

            <button
                class="nav-btn"
                id="menuBtn"
                type="button"
                aria-label="Menu"
            >
                ☰
            </button>

        </div>

    </header>



    <!-- =================================================
         SEARCH
    ================================================= -->

    <div
        class="search-panel"
        id="searchPanel"
    >

        <input
            type="search"
            id="shortSearch"
            placeholder="Search shorts..."
            autocomplete="off"
        >

        <button
            id="closeSearch"
            type="button"
        >
            ✕
        </button>

    </div>



    <!-- =================================================
         REELS FEED
    ================================================= -->

    <main
        class="reels-feed"
        id="reelsFeed"
    >


        <!-- =================================================
             REEL 1
        ================================================= -->

        <article
            class="reel"
            data-title="video 1 hot video"
        >

            <video
                class="reel-video"
                src="Videos/short1.mp4"
                playsinline
                preload="metadata"
            ></video>


            <!-- VIDEO GRADIENT -->

            <div class="video-gradient"></div>


            <!-- CENTER PLAY -->

            <button
                class="center-play"
                type="button"
                aria-label="Play"
            >
                ▶
            </button>


            <!-- RIGHT ACTIONS -->

            <div class="reel-actions">

                <button
                    class="action-btn like-btn"
                    type="button"
                    aria-label="Like"
                >
                    ♡
                    <span>Like</span>
                </button>

                <button
                    class="action-btn comment-btn"
                    type="button"
                    aria-label="Comment"
                >
                    💬
                    <span>Comment</span>
                </button>

                <button
                    class="action-btn share-btn"
                    type="button"
                    aria-label="Share"
                >
                    ↗
                    <span>Share</span>
                </button>

            </div>


            <!-- VIDEO INFORMATION -->

            <div class="reel-info">

                <h2>
                    🔥 HOT VIDEO
                </h2>

                <p>
                    Video 1 • ZIZZVERSE
                </p>

            </div>


            <!-- BOTTOM CONTROLS -->

            <div class="reel-controls">

                <button
                    class="control-btn play-control"
                    type="button"
                >
                    ▶
                </button>

                <button
                    class="control-btn mute-control"
                    type="button"
                >
                    🔊
                </button>

                <input
                    class="reel-progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                >

                <button
                    class="control-btn fullscreen-control"
                    type="button"
                >
                    ⛶
                </button>

            </div>

        </article>
