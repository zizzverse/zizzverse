    <!-- =================================================
         JAVASCRIPT
    ================================================= -->

    <script>


        /* ===============================================
           MOBILE MENU
        =============================================== */

        const menuButton =
            document.getElementById("menuBtn");

        const navigationMenu =
            document.getElementById("navLinks");


        menuButton.addEventListener(
            "click",
            () => {

                navigationMenu.classList.toggle(
                    "active"
                );


                if (
                    navigationMenu.classList.contains(
                        "active"
                    )
                ) {

                    menuButton.textContent = "✕";

                    menuButton.setAttribute(
                        "aria-label",
                        "Close menu"
                    );

                } else {

                    menuButton.textContent = "☰";

                    menuButton.setAttribute(
                        "aria-label",
                        "Open menu"
                    );

                }

            }
        );



        /* ===============================================
           CLOSE MENU AFTER LINK CLICK
        =============================================== */

        navigationMenu
            .querySelectorAll("a")
            .forEach(link => {

                link.addEventListener(
                    "click",
                    () => {

                        navigationMenu
                            .classList
                            .remove("active");

                        menuButton.textContent = "☰";

                        menuButton.setAttribute(
                            "aria-label",
                            "Open menu"
                        );

                    }
                );

            });



        /* ===============================================
           VIDEO AUTO PLAY / PAUSE
        =============================================== */

        const videos =
            document.querySelectorAll(
                ".short-card video"
            );


        const videoObserver =
            new IntersectionObserver(
                (entries) => {

                    entries.forEach(entry => {

                        const video =
                            entry.target;


                        if (
                            entry.isIntersecting &&
                            entry.intersectionRatio >= 0.7
                        ) {

                            // Pause all other videos

                            videos.forEach(
                                otherVideo => {

                                    if (
                                        otherVideo !== video
                                    ) {

                                        otherVideo.pause();

                                    }

                                }
                            );


                            // Play current video

                            video.play().catch(
                                () => {}
                            );


                        } else {

                            // Pause video when it leaves the screen

                            video.pause();

                        }

                    });

                },
                {
                    threshold: [0.7]
                }
            );


        videos.forEach(video => {

            videoObserver.observe(video);

        });



        /* ===============================================
           SHORTS SEARCH
        =============================================== */

        const searchInput =
            document.getElementById(
                "shortSearch"
            );

        const shortCards =
            document.querySelectorAll(
                ".short-card"
            );

        const noResults =
            document.getElementById(
                "noResults"
            );


        searchInput.addEventListener(
            "input",
            () => {

                const searchText =
                    searchInput.value
                        .toLowerCase()
                        .trim();


                let found = false;


                shortCards.forEach(card => {

                    const title =
                        card
                            .querySelector("h3")
                            .textContent
                            .toLowerCase();

                    const description =
                        card
                            .querySelector("p")
                            .textContent
                            .toLowerCase();

                    const dataTitle =
                        card
                            .getAttribute("data-title")
                            .toLowerCase();


                    const matches =
                        title.includes(searchText) ||
                        description.includes(searchText) ||
                        dataTitle.includes(searchText);


                    if (matches) {

                        card.style.display = "";

                        found = true;

                    } else {

                        card.style.display = "none";

                    }

                });


                if (
                    found ||
                    searchText === ""
                ) {

                    noResults.style.display = "none";

                } else {

                    noResults.style.display = "block";

                }

            }
        );


    </script>
