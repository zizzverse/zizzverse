<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demon Slayer | ZIZZVERSE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0714;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px 6%;
            border-bottom: 1px solid #2a1b43;
            background: #0b0714;
        }

        .logo {
            color: #a78bfa;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            padding: 45px 0;
        }

        .anime-box {
            display: flex;
            gap: 35px;
            background: #171027;
            border: 1px solid #2a1b43;
            border-radius: 15px;
            padding: 25px;
        }

        .poster {
            width: 260px;
            height: 370px;
            object-fit: cover;
            border-radius: 12px;
        }

        .details {
            padding: 10px 0;
        }

        h1 {
            font-size: 36px;
            color: #a78bfa;
            margin-bottom: 15px;
        }

        .description {
            color: #aaa3bd;
            line-height: 1.8;
            margin: 20px 0;
        }

        .info {
            color: #d8d1e7;
            line-height: 2;
        }

        .watch-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            color: #a78bfa;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .anime-box {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .poster {
                width: 220px;
                height: 320px;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">ZIZZVERSE</a>
</header>

<div class="container">

    <div class="anime-box">

        <img
            class="poster"
            src="images/demonslayer.jpg"
            alt="Demon Slayer"
        >

        <div class="details">

            <h1>Demon Slayer</h1>

            <div class="info">
                <p><strong>Japanese:</strong> Kimetsu no Yaiba</p>
                <p><strong>Genre:</strong> Action • Adventure • Fantasy</p>
                <p><strong>Status:</strong> Completed</p>
                <p><strong>Rating:</strong> ⭐ 9.0</p>
            </div>

            <p class="description">
                Tanjiro Kamado's journey begins after his family is attacked
                by demons and his sister Nezuko becomes a demon.
            </p>

            <a href="#" class="watch-btn">▶ Watch Now</a>

        </div>

    </div>

    <a href="index.html" class="back">← Back to ZIZZVERSE</a>

</div>

</body>
</html>
